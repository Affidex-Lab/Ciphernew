<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CipherWallet - Android App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #8876DD 0%, #6b5bb3 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 0.5s ease-out;
        }
        
        #splash.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .logo-container {
            width: 120px;
            height: 120px;
            background: white;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .logo-container svg {
            width: 80px;
            height: 80px;
        }
        
        .app-name {
            color: white;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .tagline {
            color: rgba(255,255,255,0.9);
            font-size: 14px;
        }
        
        .spinner {
            margin-top: 40px;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        #app-frame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }
        
        .offline-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            padding: 20px;
            display: none;
        }
        
        .offline-message.visible {
            display: block;
        }
        
        .offline-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        
        .offline-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        
        .offline-text {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        .retry-button {
            background: #8876DD;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
        }
        
        .retry-button:active {
            background: #6b5bb3;
        }
    </style>
</head>
<body>
    <!-- Splash Screen -->
    <div id="splash">
        <div class="logo-container">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="45" fill="#8876DD"/>
                <path d="M50 25 L65 40 L65 60 L50 75 L35 60 L35 40 Z" fill="white"/>
            </svg>
        </div>
        <div class="app-name">CipherWallet</div>
        <div class="tagline">Seedless Smart Wallets</div>
        <div class="spinner"></div>
    </div>

    <!-- Main App Frame -->
    <iframe id="app-frame" src="https://cipherwalletmvp.netlify.app" allow="clipboard-read; clipboard-write"></iframe>

    <!-- Offline Message -->
    <div id="offline-message" class="offline-message">
        <div class="offline-icon">📵</div>
        <div class="offline-title">No Internet Connection</div>
        <div class="offline-text">Please check your connection and try again</div>
        <button class="retry-button" onclick="location.reload()">Retry</button>
    </div>

    <script>
        // Handle splash screen
        const splash = document.getElementById('splash');
        const appFrame = document.getElementById('app-frame');
        const offlineMessage = document.getElementById('offline-message');
        
        // Hide splash after app loads
        appFrame.onload = function() {
            setTimeout(() => {
                splash.classList.add('hidden');
            }, 1500);
        };
        
        // Handle offline/online status
        function updateOnlineStatus() {
            if (!navigator.onLine) {
                offlineMessage.classList.add('visible');
                appFrame.style.display = 'none';
            } else {
                offlineMessage.classList.remove('visible');
                appFrame.style.display = 'block';
            }
        }
        
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        
        // Initial check
        updateOnlineStatus();
        
        // Handle Android back button
        if (window.history && window.history.pushState) {
            window.history.pushState(null, null, window.location.href);
            window.onpopstate = function() {
                window.history.pushState(null, null, window.location.href);
            };
        }
        
        // Prevent pull-to-refresh
        let lastTouchY = 0;
        let preventPullToRefresh = false;
        
        document.addEventListener('touchstart', function(e) {
            if (e.touches.length !== 1) return;
            lastTouchY = e.touches[0].clientY;
            preventPullToRefresh = window.pageYOffset === 0;
        }, { passive: false });
        
        document.addEventListener('touchmove', function(e) {
            const touchY = e.touches[0].clientY;
            const touchYDelta = touchY - lastTouchY;
            lastTouchY = touchY;
            
            if (preventPullToRefresh && touchYDelta > 0) {
                e.preventDefault();
            }
        }, { passive: false });
        
        // Service Worker for offline caching (optional)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(function(error) {
                console.log('Service Worker registration failed:', error);
            });
        }
    </script>
</body>
</html>
