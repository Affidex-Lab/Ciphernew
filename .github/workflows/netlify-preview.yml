name: Netlify Deploy Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-preview:
    name: Deploy Preview to Netlify
    runs-on: ubuntu-latest
    if: ${{ secrets.NETLIFY_AUTH_TOKEN && secrets.NETLIFY_SITE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies (ci)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Netlify CLI
        run: npm i -g netlify-cli@17

      - name: Deploy to Netlify (preview)
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          # Deploy using branch name as alias
          ALIAS=${GITHUB_HEAD_REF//\//-}
          netlify deploy \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --site "$NETLIFY_SITE_ID" \
            --dir dist \
            --message "PR #${{ github.event.number }} preview (${GITHUB_HEAD_REF})" \
            --alias "$ALIAS" \
            --json > deploy.json
          URL=$(jq -r '.deploy_url // .url // empty' deploy.json)
          if [ -z "$URL" ]; then
            echo "preview_url=" >> $GITHUB_OUTPUT
          else
            echo "preview_url=$URL" >> $GITHUB_OUTPUT
          fi

      - name: Comment preview URL on PR
        if: ${{ steps.deploy.outputs.preview_url != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const url = process.env.PREVIEW_URL || core.getInput('preview_url') || `${{ steps.deploy.outputs.preview_url }}`;
            const body = `🚀 Netlify Deploy Preview\n\nPreview: ${url}`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
